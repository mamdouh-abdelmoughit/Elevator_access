; ==========================================================================
; BioSwitch cabin-reader elevator access — firmware builds
;
;   cabin-master       ESP32-S3 in the machine room (production, WiFi)
;   nano-cabin-bridge  Arduino Nano in the cabin: Wiegand reader -> CAN
;
; Wiring: docs/CABIN_RELAY_WIRING.md (relays + status inputs) and
;         docs/CABIN_CAN_4G_MIGRATION.md (CAN bus, Nano, reader).
; The old per-floor-reader master and the 4G variant are kept as
; src/main.cpp.bak / src/main_cabin_can.cpp.bak for reference only.
; ==========================================================================
[platformio]
default_envs = cabin-master

[esp32s3_base]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.variant = esp32s3
monitor_rts = 0
monitor_dtr = 0

; ==========================================================================
; PRODUCTION: cabin master — CAN receive, floor-button relays, status inputs
; (one MCP23017), remote-control relays, WiFi + HTTPS + MQTT.
; Site WiFi / keys: copy include/secrets.example.h to include/secrets.h.
; ==========================================================================
[env:cabin-master]
extends = esp32s3_base
build_src_filter = +<main_cabin_can_wifi_test.cpp>
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library
    bblanchon/ArduinoJson
    knolleary/PubSubClient
    arduino-libraries/ArduinoHttpClient

; ==========================================================================
; PRODUCTION: cabin-side bridge — Arduino Nano reads the Wiegand reader in
; the cabin and forwards each scan as a CAN frame via an MCP2515+TJA1050.
; ==========================================================================
[env:nano-cabin-bridge]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<nano_cabin_bridge.cpp>
lib_deps =
    coryjfowler/mcp_can

; ==========================================================================
; DIAGNOSTICS (bench only)
; ==========================================================================
; ESP32-S3 TWAI self-test, no Nano/second node required.
[env:esp32-s3-can-selftest]
extends = esp32s3_base
build_src_filter = +<can_selftest.cpp>

; Raw pin-level sniffer on the ESP32's CAN RX line (GPIO5).
[env:esp32-s3-can-pin-sniffer]
extends = esp32s3_base
build_src_filter = +<can_pin_sniffer.cpp>

; Raw SN65HVD230 transceiver loopback test, no TWAI/bus needed.
[env:esp32-s3-can-transceiver-loopback]
extends = esp32s3_base
build_src_filter = +<can_transceiver_loopback.cpp>
